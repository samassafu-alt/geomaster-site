<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoMaster</title>
<meta name="description" content="GeoMaster — le quiz de géographie : 197 pays, 13 catégories, 8 langues.">
<meta name="theme-color" content="#58CC02">
<style>
  :root{--green:#58CC02;--green-shadow:#58A700;--blue:#1CB0F6;--yellow:#FFC800;--text:#3C3C3C;--light:#777;--border:#E5E5E5;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Nunito,ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:#F7F7F7;min-height:100vh;display:flex;justify-content:center;}
  main{width:100%;max-width:480px;background:#fff;min-height:100vh;display:flex;flex-direction:column;}
  .hero{background:linear-gradient(135deg,#58CC02,#46A302);color:#fff;text-align:center;padding:34px 22px 30px;}
  .hero img{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2));animation:idle 3.6s ease-in-out infinite;}
  @keyframes idle{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-4deg)}60%{transform:translateY(-5px) rotate(4deg)}}
  @media (prefers-reduced-motion:reduce){.hero img{animation:none}}
  h1{font-size:34px;font-weight:900;letter-spacing:-.5px;margin-top:6px;}
  .hero p{font-weight:700;font-size:15px;opacity:.95;margin-top:6px;}
  .body{padding:22px 20px 30px;flex:1;display:flex;flex-direction:column;gap:16px;}
  .card{border:2px solid var(--border);border-radius:18px;padding:16px;}
  .card h2{font-size:19px;font-weight:900;margin-bottom:12px;}
  ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px;}
  ol li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15px;}
  ol li::before{content:counter(s);flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .code{margin-top:12px;background:#F7F7F7;border:2px dashed #CFCFCF;border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;user-select:all;-webkit-user-select:all;}
  button,a.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px 18px;font-family:inherit;font-weight:900;font-size:16px;text-align:center;text-decoration:none;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;}
  .copy{margin-top:10px;background:#fff;color:var(--blue);border:2px solid var(--border);box-shadow:0 4px 0 var(--border);}
  .store{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-shadow);}
  .foot{text-align:center;font-size:13px;font-weight:700;color:var(--light);}
  [hidden]{display:none!important}
</style>
</head>
